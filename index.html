<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 核心：添加 Viewport 标签，让网页完美适配手机屏幕尺寸 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>北京市城市骑行专题地图</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; height: 100vh; display: flex; background: #121212; color: #fff; overflow: hidden; }
        #map { width: 100%; height: 100vh; z-index: 1; }

        /* 手机端适配：头部标题栏更紧凑 */
        .app-header { position: absolute; top: 15px; left: 15px; z-index: 1001; background: rgba(20, 24, 33, 0.85); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); padding: 8px 15px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .app-header h1 { margin: 0; font-size: 15px; color: #fff; }
        .app-header span { font-size: 9px; color: #00CED1; }

        /* 手机端适配：左侧面板尺寸调整 */
        .sidebar { position: absolute; top: 75px; left: 15px; bottom: 20px; width: 320px; max-width: 85%; z-index: 1000; background: rgba(15, 18, 25, 0.9); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; display: flex; flex-direction: column; transition: transform 0.35s cubic-bezier(0.25, 0.8, 0.25, 1); }
        .sidebar.collapsed { transform: translateX(-120%); }

        .collapse-btn { position: absolute; top: 75px; left: calc(min(320px, 85%) + 15px); z-index: 1001; background: rgba(15, 18, 25, 0.9); border: 1px solid rgba(255,255,255,0.1); color: #fff; width: 30px; height: 40px; border-radius: 0 8px 8px 0; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 12px; transition: left 0.35s cubic-bezier(0.25, 0.8, 0.25, 1); }
        .sidebar.collapsed ~ .collapse-btn { left: 0px; background: #00CED1; color: #000; }

        /* 内部样式保持不变 */
        .sidebar-tabs { display: flex; background: rgba(0,0,0,0.4); border-bottom: 1px solid rgba(255,255,255,0.05); flex-shrink: 0; }
        .tab-btn { flex: 1; padding: 10px 0; text-align: center; font-size: 12px; color: #888; cursor: pointer; border: none; background: none; }
        .tab-btn.active { color: #fff; background: rgba(255,255,255,0.05); font-weight: bold; border-bottom: 2px solid #00CED1; }
        .tab-content { flex: 1; overflow-y: auto; padding: 12px; display: none; }
        .tab-content.active { display: block; }
        .tab-content::-webkit-scrollbar { width: 4px; }
        .tab-content::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 2px; }

        .route-card { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); border-radius: 6px; padding: 10px; margin-bottom: 10px; cursor: pointer; position: relative; overflow: hidden; }
        .route-color-bar { width: 4px; height: 100%; position: absolute; left: 0; top: 0; }
        .route-title { font-size: 12px; font-weight: bold; color: #fff; margin-left: 6px; margin-bottom: 5px;}
        .route-desc { font-size: 10px; color: #aaa; margin-bottom: 8px; margin-left: 6px; }
        .route-spots-tag { display: flex; flex-wrap: wrap; gap: 4px; margin-left: 6px; }
        .spot-badge { font-size: 9px; background: rgba(255,255,255,0.08); color: #ddd; padding: 2px 6px; border-radius: 4px; }

        .layer-option-btn { display: block; width: 100%; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); color: #ccc; padding: 10px; margin-bottom: 8px; border-radius: 6px; text-align: left; cursor: pointer; font-size: 11px; }
        .layer-option-btn.active { background: #00CED1; border-color: #00CED1; color: #000; font-weight: bold; }

        .custom-spot-marker { background: rgba(15, 18, 25, 0.95); border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 4px 8px; border-radius: 12px; font-size: 10px; white-space: nowrap; box-shadow: 0 4px 10px rgba(0,0,0,0.5); display: flex; align-items: center; gap: 5px; }
        .spot-dot { width: 6px; height: 6px; border-radius: 50%; }

        /* 适配手机端横屏或极小屏幕 */
        @media (max-width: 400px) {
            .app-header h1 { font-size: 13px; }
            .app-header span { font-size: 8px; }
        }
    </style>
</head>

</div>

    document.getElementById('route-count-label').innerText = PREBUILT_ROUTES.length + " 大主题精选路线 · 真实路网引擎驱动";

    PREBUILT_ROUTES.forEach(route => {
        const polyline = L.polyline(route.path, { color: route.color, weight: 5, opacity: 0.9, lineCap: 'round', lineJoin: 'round' });
        linesGroup.addLayer(polyline);
        routeLayers.push({ id: route.id, layer: polyline });

        let routeSpotsHTML = "";
        route.spots.forEach(spot => {
            routeSpotsHTML += `<span class="spot-badge" style="color:${route.color}">${spot.name}</span>`;
            const customIcon = L.divIcon({
                className: 'custom-div-icon',
                html: `<div class="custom-spot-marker"><div class="spot-dot" style="background:${route.color};"></div>${spot.name}</div>`,
                iconSize: [100, 26], iconAnchor: [50, 13]
            });
            spotMarkersGroup.addLayer(L.marker(spot.coord, { icon: customIcon }));
        });

        const card = document.createElement('div');
        card.className = 'route-card';
        card.innerHTML = `
            <div class="route-color-bar" style="background: ${route.color};"></div>
            <div class="route-title">${route.id}: ${route.tag}</div>
            <div class="route-desc">${route.name}</div>
            <div class="route-spots-tag">${routeSpotsHTML}</div>
        `;

        card.onclick = function() {
            routeLayers.forEach(r => r.layer.setStyle({ weight: 3, opacity: 0.25 }));
            polyline.setStyle({ weight: 7, opacity: 1.0 });
            polyline.bringToFront();

            // 手机端点击后自动收起侧边栏，优化体验
            if (window.innerWidth <= 600) { toggleSidebar(); }

            map.fitBounds(polyline.getBounds(), { padding: [60, 60], maxZoom: 14, animate: true });
        };

        container.appendChild(card);
    });

    if (routeLayers.length > 0) {
        map.fitBounds(new L.featureGroup(routeLayers.map(r => r.layer)).getBounds(), { padding: [30, 30] });
    }
</script>
</body>
</html>
